<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Orion — Wise Virtual Assistant</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/style.css">
</head>
<body class="light">
  <div class="topbar">
    <h1>Orion — Wise Virtual Assistant</h1>
    <div class="actions">
      <button id="themeToggle">Dark Mode</button>
    </div>
  </div>

  <main class="container">
    <div id="chatbox" class="chatbox"></div>

    <div class="controls">
      <input id="userInput" placeholder="Type your message..." />
      <button id="sendBtn">Send</button>
      <button id="voiceBtn" title="Speak">🎤</button>
      <button id="exportBtn" title="Export chat">Export</button>
    </div>
  </main>

  <div id="loader" class="loader hidden">Orion is thinking…</div>

  <script src="/script.js"></script>
</body>
</html>
